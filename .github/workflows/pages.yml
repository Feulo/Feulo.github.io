name: Publicar site

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar senha da landing
        env:
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
          SITE_PASSWORD_ATUAL: ${{ secrets.SITE_PASSWORD_ATUAL }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re
          path = pathlib.Path("js/site-config.js")
          texto = path.read_text()

          def aplicar(texto, campo, valor):
              if not valor:
                  return texto
              digest = hashlib.md5(valor.encode("utf-8")).hexdigest()
              novo, trocas = re.subn(
                  rf'{campo}:\s*"(?:\\.|[^"\\])*"',
                  f"{campo}: {json.dumps(digest)}",
                  texto,
                  count=1,
              )
              if trocas != 1:
                  raise SystemExit(f"Não encontrei {campo} em js/site-config.js")
              return novo

          texto = aplicar(texto, "senhaLegado", os.environ.get("SITE_PASSWORD", ""))
          texto = aplicar(texto, "senhaAtual", os.environ.get("SITE_PASSWORD_ATUAL", ""))
          path.write_text(texto)
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
