name: Publicar site

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar senha da landing
        env:
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re
          senha = os.environ.get("SITE_PASSWORD", "")
          if not senha:
              raise SystemExit(0)
          path = pathlib.Path("js/site-config.js")
          texto = path.read_text()
          literal = json.dumps(senha)
          novo, trocas = re.subn(
              r'senha:\s*"(?:\\.|[^"\\])*"',
              f"senha: {literal}",
              texto,
              count=1,
          )
          if trocas != 1:
              raise SystemExit("Não encontrei a senha em js/site-config.js")
          path.write_text(novo)
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
